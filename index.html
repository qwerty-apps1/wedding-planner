<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f1f3;--card:#fff;--ink:#2a1f26;--mute:#7a6a73;--line:#e6dbe0;--accent:#7b1e4a;--accent-ink:#fff;--ok:#2f6b4f;--prog:#a0661a;--todo:#6b5b8a;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#1a1217;--card:#251a21;--ink:#f3e9ee;--mute:#b3a1ab;--line:#3a2a33;--accent:#e08ab0;--accent-ink:#2a1020;--ok:#7fd0a7;--prog:#e5b36a;--todo:#b9a8da;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Instrument Sans',system-ui,sans-serif}
h1,h2,.num{font-family:Fraunces,Georgia,serif}
main{max-width:900px;margin:0 auto;padding:24px 16px 80px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:2rem;margin:0;line-height:1.1}
.sub{color:var(--mute);font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.link{border:0;background:none;color:var(--accent);padding:4px 8px}
button.danger{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.home{display:grid;grid-template-columns:1.2fr 2fr;gap:12px;margin-bottom:12px}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cnt{text-align:left;border-top:4px solid var(--c)}.cnt .num{display:block}.hero{display:flex;flex-direction:column;justify-content:center}@media(max-width:640px){.home{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.box .num{font-size:1.7rem;font-weight:700}
.box small{color:var(--mute)}
.bycat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;font-size:13px}
.bycat span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters>*{flex:1 1 140px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:10px;padding:14px 16px;margin-bottom:10px}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item h2{font-size:1.1rem;margin:0}
.item p{margin:4px 0 8px;color:var(--mute);white-space:pre-wrap}
.tags{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;align-items:center}
.tag{border:1px solid var(--line);border-radius:99px;padding:1px 10px}
.st{font-weight:600;color:var(--c)}
.cost{font-weight:600;white-space:nowrap}
.meta{color:var(--mute);font-size:12px;margin-top:6px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:20px;width:min(480px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 12px}
label{display:block;margin:10px 0 4px;font-weight:500;font-size:13.5px}
.row{display:flex;gap:8px}.row>*{flex:1}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 12px}
.chip button{border:0;background:none;padding:0 6px;color:var(--bad)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.hint{font-size:12.5px;color:var(--mute)}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Wedding planner</h1><div class="sub" id="mode"></div></div>
    <div>
      <button id="bCats">Event categories</button>
      <button id="bAdd" class="primary">Add task</button>
    </div>
  </header>
  <section class="home" aria-label="Overview">
    <div class="box hero"><small>Expenses so far (till <span id="today"></span>)</small><div class="num" id="tSpent">0</div><small id="tEst"></small></div>
    <div class="counts">
      <button class="box cnt" data-s="To be started" style="--c:var(--todo)"><span class="num" id="nTodo">0</span><small>Not started</small></button>
      <button class="box cnt" data-s="In progress" style="--c:var(--prog)"><span class="num" id="nProg">0</span><small>In progress</small></button>
      <button class="box cnt" data-s="Completed" style="--c:var(--ok)"><span class="num" id="nDone">0</span><small>Completed</small></button>
    </div>
  </section>
  <div class="bycat" id="byCat"></div>
  <div class="filters">
    <input id="q" placeholder="Search title or description" aria-label="Search">
    <select id="fStatus" aria-label="Filter by status"></select>
    <select id="fCat" aria-label="Filter by event"></select>
  </div>
  <div id="list"></div>
</main>

<dialog id="dTodo"><form method="dialog" id="fTodo">
  <h2 id="dTitle">Add task</h2>
  <label for="title">Title *</label><input id="title" required maxlength="120">
  <label for="desc">Description</label><textarea id="desc" rows="3"></textarea>
  <div class="row">
    <div><label for="event">Event *</label><select id="event" required></select></div>
    <div><label for="status">Stage *</label><select id="status"></select></div>
  </div>
  <label for="cost" id="costL">Expense</label><input id="cost" type="number" min="0" step="0.01" inputmode="decimal">
  <div class="hint" id="meta"></div>
  <div class="err" id="err"></div>
  <div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary" id="save">Save task</button></div>
</form></dialog>

<dialog id="dCats">
  <h2>Event categories</h2>
  <div class="chips" id="chips"></div>
  <div class="row"><input id="newCat" placeholder="e.g. Haldi, Reception" maxlength="40"><button id="addCat" class="primary" style="flex:0 0 auto">Add category</button></div>
  <div class="err" id="catErr"></div>
  <div class="actions"><button id="closeCats">Done</button></div>
</dialog>

<dialog id="dPass"><form method="dialog">
  <h2>Family passcode</h2>
  <p class="hint">Ask whoever shared this link for the passcode. You only enter it once on this device.</p>
  <label for="pIn">Passcode</label><input id="pIn" type="password" autocomplete="off">
  <div class="actions"><button class="primary" id="pOk">Open planner</button></div>
</form></dialog>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const STAGES=['To be started','In progress','Completed'];
const COLOR={'To be started':'var(--todo)','In progress':'var(--prog)','Completed':'var(--ok)'};
let db={categories:['Engagement','Marriage'],todos:[]}, sha=null, editId=null;
// Paste your Supabase project URL and anon (public) key here. Leave blank to save in this browser only.
const SB_URL='https://kryzfpgqtjkhbjtmgomm.supabase.co', SB_KEY='sb_publishable_euQZ4ocTn0-eJwYjPpukNw_xoAgBS9R';
let pass=localStorage.getItem('wp_pass')||'', version=null;
const useSb=()=>SB_URL.startsWith('https://');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
const when=iso=>new Date(iso).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2600)}

async function rpc(fn,args){
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB_KEY,...(SB_KEY.startsWith('eyJ')?{Authorization:'Bearer '+SB_KEY}:{}),'Content-Type':'application/json'},body:JSON.stringify(args)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.message||('Error '+r.status));
  return j;
}
function normalize(d){return{categories:Array.isArray(d.categories)?d.categories:[],todos:Array.isArray(d.todos)?d.todos:[]}}
function askPass(){$('#pIn').value='';$('#dPass').showModal()}
async function load(){
  try{
    if(useSb()){
      if(!pass){askPass();return}
      const j=await rpc('get_data',{p_pass:pass});
      version=j.version;db=normalize(j.data);
    }else{
      const l=localStorage.getItem('wp_db');if(l)db=normalize(JSON.parse(l));
    }
  }catch(e){
    if(e.message==='bad passcode'){pass='';localStorage.removeItem('wp_pass');toast('Wrong passcode. Try again.');askPass();return}
    toast('Load failed: '+e.message);
  }
  render();
}
async function persist(){
  if(!useSb()){localStorage.setItem('wp_db',JSON.stringify(db));return true}
  try{const j=await rpc('save_data',{p_pass:pass,p_data:db,p_version:version});version=j.version;return true}
  catch(e){
    if(e.message==='conflict'){toast('Someone else just saved. Showing the latest, please redo your change.');await load();return 'reloaded'}
    toast('Save failed: '+e.message);return false;
  }
}
async function commit(fn){const snap=JSON.stringify(db);fn();if((await persist())===false){db=JSON.parse(snap)}render()}

function render(){
  $('#mode').textContent=useSb()?'Shared with family. Changes save automatically.':'Saving in this browser only';
  const sel=(el,opts,all,cur)=>{el.innerHTML=(all?`<option value="">${all}</option>`:'')+opts.map(o=>`<option>${esc(o)}</option>`).join('');el.value=cur||''};
  sel($('#fStatus'),STAGES,'All stages',$('#fStatus').value);
  sel($('#fCat'),db.categories,'All events',$('#fCat').value);
  const spent=db.todos.filter(t=>t.status==='Completed').reduce((a,t)=>a+Number(t.cost||0),0);
  const est=db.todos.filter(t=>t.status!=='Completed').reduce((a,t)=>a+Number(t.cost||0),0);
  $('#tSpent').textContent=money(spent);$('#tEst').textContent=est?`Plus ${money(est)} estimated for pending tasks`:'No pending estimates';
  $('#today').textContent=new Date().toLocaleDateString(undefined,{dateStyle:'medium'});
  const n=st=>db.todos.filter(t=>t.status===st).length;
  $('#nTodo').textContent=n(STAGES[0]);$('#nProg').textContent=n(STAGES[1]);$('#nDone').textContent=n(STAGES[2]);
  $('#byCat').innerHTML=db.categories.map(c=>{const s=db.todos.filter(t=>t.event===c).reduce((a,t)=>a+Number(t.cost||0),0);return `<span>${esc(c)}: ${money(s)}</span>`}).join('');
  const q=$('#q').value.toLowerCase(),fs=$('#fStatus').value,fc=$('#fCat').value;
  const rows=db.todos.filter(t=>(!fs||t.status===fs)&&(!fc||t.event===fc)&&(!q||(t.title+' '+t.description).toLowerCase().includes(q)))
    .sort((a,b)=>b.modified.localeCompare(a.modified));
  $('#list').innerHTML=rows.length?rows.map(t=>`<div class="item" style="--c:${COLOR[t.status]}">
    <div class="top"><h2>${esc(t.title)}</h2><span class="cost">${t.cost!==''&&t.cost!=null?money(t.cost):'No cost'}</span></div>
    ${t.description?`<p>${esc(t.description)}</p>`:''}
    <div class="tags"><span class="st">${esc(t.status)}</span><span class="tag">${esc(t.event)}</span>
    <span style="flex:1"></span><button class="link" data-e="${t.id}">Edit</button><button class="link danger" data-d="${t.id}">Delete</button></div>
    <div class="meta">Created ${when(t.created)}. Modified ${when(t.modified)}.</div></div>`).join('')
    :'<div class="empty">No tasks here yet. Add your first one.</div>';
}

function openTodo(id){
  editId=id;const t=db.todos.find(x=>x.id===id)||{};
  if(!db.categories.length){toast('Add an event category first');openCats();return}
  $('#dTitle').textContent=id?'Edit task':'Add task';
  $('#title').value=t.title||'';$('#desc').value=t.description||'';
  $('#event').innerHTML=db.categories.map(c=>`<option>${esc(c)}</option>`).join('');
  $('#event').value=t.event||db.categories[0];
  $('#status').innerHTML=STAGES.map(s=>`<option>${s}</option>`).join('');
  $('#status').value=t.status||STAGES[0];
  $('#cost').value=t.cost??'';$('#err').textContent='';
  $('#meta').textContent=t.id?`Created ${when(t.created)}. Modified ${when(t.modified)}.`:'Created and modified times are set automatically.';
  costLabel();$('#dTodo').showModal();
}
function costLabel(){const c=$('#status').value==='Completed';$('#costL').textContent=c?'Expense * (required when completed)':'Expense';$('#cost').required=c}
$('#status').onchange=costLabel;
$('#bAdd').onclick=()=>openTodo(null);
$('#cancel').onclick=()=>$('#dTodo').close();
$('#fTodo').onsubmit=async e=>{
  e.preventDefault();
  const title=$('#title').value.trim(),status=$('#status').value,raw=$('#cost').value;
  if(!title){$('#err').textContent='Title is required.';return}
  if(status==='Completed'&&(raw===''||isNaN(raw)||Number(raw)<0)){$('#err').textContent='Enter the expense to mark this task completed.';return}
  const now=new Date().toISOString(),cost=raw===''?'':Number(raw);
  $('#dTodo').close();
  await commit(()=>{
    const data={title,description:$('#desc').value.trim(),event:$('#event').value,status,cost,modified:now};
    if(editId)Object.assign(db.todos.find(x=>x.id===editId),data);
    else db.todos.push({id:crypto.randomUUID(),created:now,...data});
  });
};
$('#list').onclick=async e=>{
  if(e.target.dataset.e)openTodo(e.target.dataset.e);
  if(e.target.dataset.d&&confirm('Delete this task?'))await commit(()=>{db.todos=db.todos.filter(t=>t.id!==e.target.dataset.d)});
};
document.querySelector('.counts').onclick=e=>{const b=e.target.closest('.cnt');if(!b)return;const f=$('#fStatus');f.value=f.value===b.dataset.s?'':b.dataset.s;render()};
['#q','#fStatus','#fCat'].forEach(s=>$(s).oninput=render);

function openCats(){
  $('#chips').innerHTML=db.categories.map(c=>`<span class="chip">${esc(c)}<button data-c="${esc(c)}" aria-label="Remove ${esc(c)}">&times;</button></span>`).join('')||'<span class="hint">No categories yet.</span>';
  $('#catErr').textContent='';if(!$('#dCats').open)$('#dCats').showModal();
}
$('#bCats').onclick=openCats;$('#closeCats').onclick=()=>$('#dCats').close();
$('#addCat').onclick=async()=>{
  const v=$('#newCat').value.trim();
  if(!v)return;
  if(db.categories.some(c=>c.toLowerCase()===v.toLowerCase())){$('#catErr').textContent='That category already exists.';return}
  await commit(()=>db.categories.push(v));$('#newCat').value='';openCats();
};
$('#newCat').onkeydown=e=>{if(e.key==='Enter')$('#addCat').click()};
$('#chips').onclick=async e=>{
  const c=e.target.dataset.c;if(!c)return;
  if(db.todos.some(t=>t.event===c)){$('#catErr').textContent=`"${c}" is used by tasks. Change or delete those tasks first.`;return}
  await commit(()=>{db.categories=db.categories.filter(x=>x!==c)});openCats();
};

$('#pOk').onclick=async e=>{
  e.preventDefault();pass=$('#pIn').value.trim();if(!pass)return;
  localStorage.setItem('wp_pass',pass);$('#dPass').close();await load();
};
// Optional one-tap link: https://<site>/#pass=PASSCODE
if(location.hash.startsWith('#pass=')){
  pass=decodeURIComponent(location.hash.slice(6));localStorage.setItem('wp_pass',pass);
  history.replaceState(null,'',location.pathname+location.search);
}
load();
</script>
</body>
</html>
